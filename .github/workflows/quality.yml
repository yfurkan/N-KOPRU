name: N-KOPRU quality gate

on:
  push:
    branches: [main, finalist-v1.5.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run backend regression suite
        working-directory: backend
        env:
          N_KOPRU_DB_PATH: /tmp/nkopru-ci.db
        run: python -m unittest discover -s tests -p 'run_*.py' -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Type-check generated Next types
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
